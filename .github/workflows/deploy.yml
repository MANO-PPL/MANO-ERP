name: Deploy Mano-ERP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy Frontend Build to EC2 (via SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "frontend/dist/**"
          target: "/home/ubuntu/MANO-ERP"

      - name: Update Backend & Reload Services (via SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/MANO-ERP
            
            # 1. Fetch latest changes and merge (Backend files)
            git fetch origin
            git reset --hard origin/main
            
            # 2. Update Backend packages
            cd backend
            npm install --production
            
            # 3. Update Python virtual environment packages if requirements.txt changed
            cd src/modules/ai/python_engine
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install -r requirements.txt
              deactivate
            fi
            
            # 4. Restart backend server using PM2
            pm2 restart mano-erp-backend
