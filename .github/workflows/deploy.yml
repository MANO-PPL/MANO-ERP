name: Deploy to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-mano-erp
  cancel-in-progress: false

jobs:
  build-assets:
    name: Build Frontend (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  deploy-to-ec2:
    name: Deploy via Central Self-Hosted Runner
    needs: build-assets
    runs-on: [self-hosted, ec2-prod]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Sync Production Codebase
        run: |
          echo "📥 Updating production repository codebase..."
          cd /var/www/MANO-ERP || exit
          sudo git fetch origin main
          sudo git reset --hard origin/main

      - name: Deploy Backend & Restart PM2
        run: |
          echo "⚙ Setting up Backend in production directory..."
          cd /var/www/MANO-ERP/backend
          sudo npm install --production --no-audit --no-fund
          
          # Update Python virtual environment packages if requirements.txt exists
          if [ -d "src/modules/ai/python_engine/venv" ]; then
            echo "🐍 Updating Python dependencies..."
            source src/modules/ai/python_engine/venv/bin/activate
            pip install -r src/modules/ai/python_engine/requirements.txt
            deactivate
          fi
          
          # Restart backend process using PM2
          echo "🔄 Reloading backend with PM2..."
          if sudo pm2 describe "MANO-ERP" > /dev/null 2>&1; then
            sudo pm2 reload "MANO-ERP" --update-env
          elif pm2 describe "MANO-ERP" > /dev/null 2>&1; then
            pm2 reload "MANO-ERP" --update-env
          else
            echo "🚀 Starting new backend process under PM2..."
            sudo pm2 start server.js --name "MANO-ERP" --update-env
          fi

      - name: Deploy Frontend to Nginx Target
        run: |
          echo "📁 Copying pre-built assets to production dist..."
          sudo mkdir -p /var/www/MANO-ERP/frontend/dist
          sudo cp -r $GITHUB_WORKSPACE/frontend/dist/* /var/www/MANO-ERP/frontend/dist/

          # Validate and reload Nginx
          if sudo nginx -t; then
            sudo systemctl reload nginx
            echo "✅ Nginx reloaded successfully."
          else
            echo "❌ Nginx config test failed."
            exit 1
          fi
          echo "🎉 Deployment successfully completed!"
