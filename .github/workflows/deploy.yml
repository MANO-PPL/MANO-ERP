name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-assets:
    name: Build Frontend (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  deploy-to-ec2:
    name: Deploy via Self-Hosted Runner
    needs: build-assets
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Sync Production Codebase
        run: |
          echo "📥 Updating production repository codebase..."
          cd /home/ubuntu/MANO-ERP || exit
          git fetch origin main
          git reset --hard origin/main

      - name: Deploy Backend & Restart PM2
        run: |
          echo "⚙ Setting up Backend in production directory..."
          cd /home/ubuntu/MANO-ERP/backend
          npm install --production --no-audit --no-fund
          
          # Update Python virtual environment packages if requirements.txt changed
          cd src/modules/ai/python_engine
          if [ -d "venv" ]; then
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate
          fi
          
          # Restart backend process using PM2
          cd /home/ubuntu/MANO-ERP/backend
          if pm2 describe "MANO-ERP-BACKEND" > /dev/null 2>&1; then
            echo "🔄 Reloading backend with PM2..."
            pm2 reload "MANO-ERP-BACKEND" --update-env
          else
            echo "🚀 Starting new backend process under PM2..."
            pm2 start server.js --name "MANO-ERP-BACKEND" --update-env
          fi

      - name: Deploy Frontend to Nginx Target
        run: |
          echo "📁 Copying pre-built assets to Nginx target..."
          mkdir -p /home/ubuntu/MANO-ERP/frontend/dist
          cp -r $GITHUB_WORKSPACE/frontend/dist/* /home/ubuntu/MANO-ERP/frontend/dist/
          
          # Fix Nginx permissions
          sudo chmod +x /home/ubuntu
          sudo chmod -R 755 /home/ubuntu/MANO-ERP/frontend/dist
